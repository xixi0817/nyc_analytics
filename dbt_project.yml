name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
 nyc_analytics:
   +materialized: table

   assignment_work:
     staging:
       +materialized: table
       +schema: nyc_homework_staging

     marts:
       +materialized: table
       +schema: nyc_homework_warehouse_marts
      
       conformed:
         +materialized: table

       dob_job_filings:
         +materialized: table

       dot_311:
         +materialized: table
   # Group 4 project models (separate from HW4 assignment_work)
   group4:
     # Staging models -> BigQuery dataset group4_staging
     staging:
       +materialized: table
       +schema: group4_staging

     # Dimension and fact models -> BigQuery dataset group4_warehouse
     marts:
       +materialized: table
       +schema: group4_warehouse

       # Shared dims used by both facts (dim_date, dim_location)
       conformed:
         +materialized: table

       # DOB permit fact and its dims
       dob_permit:
         +materialized: table

       # 311 complaint fact and its dims
       nyc311_complaint:
         +materialized: table